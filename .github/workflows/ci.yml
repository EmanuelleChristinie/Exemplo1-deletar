name: CI/CD Pipeline Python

on:
  push:
    branches: [ main, master ]

jobs:
  # --- ETAPA 1: CI (Integração Contínua) ---
  ci-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Testes
        run: |
          pytest

  # --- ETAPA 2: CD (Entrega Contínua) ---
  cd-deploy:
    needs: ci-testes 
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Copiar código
        uses: actions/checkout@v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e Publicar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_lower }}:latest